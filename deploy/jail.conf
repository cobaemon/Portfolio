[DEFAULT]
# Ban IP for 10 minutes (600 seconds) on multiple failed attempts
bantime  = 600
findtime = 600
maxretry = 3

# Action to perform when banning IP
banaction = iptables-multiport
banaction_allports = iptables-allports
banaction = %(banaction_allports)s

[sshd]
enabled  = true
port     = ssh
logpath  = /var/log/auth.log
maxretry = 3

[nginx-http-auth]
enabled  = true
port     = http,https
filter   = nginx-http-auth
logpath  = /var/log/nginx/error.log
maxretry = 3

[nginx-botsearch]
enabled  = true
port     = http,https
filter   = nginx-botsearch
logpath  = /var/log/nginx/access.log
maxretry = 3

# Optional: block IPs that trigger 404 errors frequently (for bot scanning)
[nginx-404]
enabled  = true
port     = http,https
filter   = nginx-404
logpath  = /var/log/nginx/access.log
maxretry = 3

# Block IPs that trigger 400 errors frequently (for bot scanning)
[nginx-400]
enabled  = true
port     = http,https
filter   = nginx-400
logpath  = /var/log/nginx/access.log
maxretry = 3

[nginx-noscript]
enabled  = true
port     = http,https
filter   = nginx-noscript
logpath  = /var/log/nginx/access.log
maxretry = 3

[nginx-proxy]
enabled  = true
port     = http,https
filter   = nginx-proxy
logpath  = /var/log/nginx/access.log
maxretry = 3

[nginx-limit-req]
enabled  = true
port     = http,https
filter   = nginx-limit-req
logpath  = /var/log/nginx/access.log
maxretry = 3
