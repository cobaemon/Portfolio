services:
  db:
    container_name: portfolio-db
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
  
  web:
    container_name: portfolio-web
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - static_volume:/app/Portfolio/staticfiles
      - log_volume:/app/Portfolio/logs
    depends_on:
      - db

  nginx:
    container_name: portfolio-nginx
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8080:80"
      - "4433:443"
    env_file:
      - .env
    volumes:
      - static_volume:/static
      - log_volume:/var/log/nginx
    depends_on:
      - web

volumes:
  static_volume:
  log_volume:
  postgres_data:
