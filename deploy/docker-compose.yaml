services:
  web:
    container_name: portfolio-web
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - static_volume:/app/Portfolio/statics
      - log_volume:/app/Portfolio/logs

  nginx:
    container_name: portfolio-nginx
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8080:80"
      - "4433:443"
    env_file:
      - .env
    volumes:
      - static_volume:/static
      - log_volume:/var/log/nginx
    depends_on:
      - web

volumes:
  static_volume:
  log_volume:
